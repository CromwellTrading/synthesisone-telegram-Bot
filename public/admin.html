<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SynthesisOne · Admin</title><link rel="stylesheet" href="/admin.css"></head><body><main class="shell"><header><span>SYNTHESEONE · ADMIN</span><h1>Centro de control</h1><p>Pool de archivos · tickets · entregas</p></header><section id="login" class="panel"><h2>Acceso administrativo</h2><input id="password" type="password" placeholder="Contraseña"><button onclick="login()">Entrar</button><p id="loginResult"></p></section><section id="app" class="hidden"><div class="toolbar"><button onclick="loadAll()">↻ Actualizar</button><button onclick="logout()">Salir</button></div><section class="panel create-offer"><div class="row"><div><h2>➕ Nueva oferta</h2><p class="muted">Sube un archivo, ponle nombre y precio. El cliente verá esa oferta automáticamente.</p></div></div><form id="offerForm" onsubmit="createOffer(event)"><div class="formgrid"><label>Nombre de la oferta<input id="offerName" required maxlength="120" placeholder="Ej. Pack Premium"></label><label>Precio (CUP)<input id="offerPrice" required type="number" min="0.01" step="0.01" placeholder="5"></label></div><label>Descripción<input id="offerDescription" maxlength="240" placeholder="Descripción breve para el cliente"></label><label>Archivo del pool<input id="offerFile" required type="file"></label><button id="offerSubmit" type="submit">Crear oferta y subir archivo</button><p id="offerResult" class="result"></p></form></section><div id="plans" class="plans"></div><div class="panel"><div class="row"><h2>Tickets</h2><span id="ticketCount"></span></div><div id="tickets" class="table"></div></div><div class="panel"><h2>Archivos del pool</h2><div id="files" class="table"></div></div></section></main><script src="/admin.js"></script></body></html>
